<!doctype html>
<html>
  <head>
    <title>BGZF Worker Pool Scaling</title>
    <script type="importmap">
      {
        "imports": {
          "pako-esm2": "/node_modules/pako-esm2/esm/main.js",
          "generic-filehandle2": "/node_modules/generic-filehandle2/esm/browser.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import {
        unzipChunkSlice,
        createBgzfWorkerPool,
        scanBgzfBlocks,
      } from '/esm/index.js'

      async function fetchFile(path) {
        const response = await fetch(path)
        return new Uint8Array(await response.arrayBuffer())
      }

      function wholeFileChunk(data) {
        const blocks = scanBgzfBlocks(data, 0, data.length)
        const last = blocks[blocks.length - 1]
        return {
          blocks: blocks.length,
          chunk: {
            minv: { dataPosition: 0, blockPosition: 0 },
            maxv: { dataPosition: 65535, blockPosition: last.filePosition },
          },
        }
      }

      function same(a, b) {
        if (a.length !== b.length) {
          return false
        }
        for (let i = 0; i < a.length; i++) {
          if (a[i] !== b[i]) {
            return false
          }
        }
        return true
      }

      // Arms are interleaved inside each round and reduced with min, so machine
      // drift lands on both arms rather than on whichever ran last. See the
      // benchmark traps in jbrowse-components' BGZF_WORKER_POOL.md.
      async function timeArm(data, chunk, pool, reps) {
        const start = performance.now()
        for (let i = 0; i < reps; i++) {
          await unzipChunkSlice(data, chunk, pool)
        }
        return (performance.now() - start) / reps
      }

      // The inflate alone, with the serial reassembly `unzipChunkSlice` does
      // after it left out. This is the part the pool can actually reach, and
      // measuring it against the sequential *whole* is the trap that produced
      // the speedup this doc used to quote.
      async function timeInflateOnly(data, chunk, pool, reps) {
        const start = performance.now()
        for (let i = 0; i < reps; i++) {
          const blocks = scanBgzfBlocks(
            data,
            chunk.minv.blockPosition,
            chunk.maxv.blockPosition,
          )
          await pool.decompressBlocks(data, blocks)
        }
        return (performance.now() - start) / reps
      }

      async function benchFile(name, data, pools, reps, rounds) {
        const { blocks, chunk } = wholeFileChunk(data)
        const arms = [
          { key: 'seq', run: () => timeArm(data, chunk, undefined, reps) },
          ...pools.flatMap(p => [
            {
              key: String(p.count),
              run: () => timeArm(data, chunk, p.pool, reps),
            },
            {
              key: `${p.count}i`,
              run: () => timeInflateOnly(data, chunk, p.pool, reps),
            },
          ]),
        ]

        const reference = (await unzipChunkSlice(data, chunk)).buffer
        const identical = {}
        for (const p of [{ count: 'seq', pool: undefined }, ...pools]) {
          const out = await unzipChunkSlice(data, chunk, p.pool)
          identical[String(p.count)] = same(reference, out.buffer)
        }

        for (const arm of arms) {
          await arm.run()
        }

        const samples = {}
        for (const arm of arms) {
          samples[arm.key] = []
        }
        for (let r = 0; r < rounds; r++) {
          for (const arm of arms) {
            samples[arm.key].push(await arm.run())
          }
        }

        return {
          name,
          bytes: data.byteLength,
          decompressedBytes: reference.length,
          blocks,
          identical,
          samples,
        }
      }

      // A chunk of `count` consecutive blocks taken from the middle of the file.
      //
      // The input is sliced down to exactly that byte range, which is not a
      // convenience: `scanBgzfBlocks` treats the buffer as *starting* at
      // `minv.blockPosition`, and the sequential path hands the whole buffer to
      // wasm, which copies all of it into its heap and preallocates its full
      // uncompressed size. Pass the whole file with a small chunk and the
      // sequential arm inflates the file while the pooled arm inflates the
      // chunk — which reads as a 2-3x speedup on two blocks. bam-js passes the
      // read that covers the chunk, so this matches it.
      function middleChunk(data, allBlocks, count) {
        const start = Math.max(0, Math.floor((allBlocks.length - count) / 2))
        const first = allBlocks[start]
        const last = allBlocks[Math.min(start + count, allBlocks.length) - 1]
        const end = last.inputOffset + last.compressedSize
        return {
          input: data.slice(first.inputOffset, end),
          compressed: end - first.inputOffset,
          chunk: {
            minv: { dataPosition: 0, blockPosition: first.filePosition },
            maxv: { dataPosition: 65535, blockPosition: last.filePosition },
          },
        }
      }

      // A chunk far larger than any fixture, built by repeating the file's block
      // range. BGZF is concatenated gzip members, so a repeat is a valid chunk
      // with the same block-size distribution — and `scanBgzfBlocks` assigns
      // file positions by walking it, so the copies are indistinguishable from
      // more data. The ratios plateau by a couple of MB; this exists to put an
      // absolute number on a query big enough for the saving to be measured in
      // seconds rather than milliseconds.
      function repeatedChunk(data, targetUncompressedBytes) {
        const blocks = scanBgzfBlocks(data, 0, data.length)
        const last = blocks[blocks.length - 1]
        const usable = last.inputOffset + last.compressedSize
        const perCopy = blocks.reduce((a, b) => a + b.decompressedSize, 0)
        const copies = Math.max(
          1,
          Math.round(targetUncompressedBytes / perCopy),
        )

        const input = new Uint8Array(usable * copies)
        for (let i = 0; i < copies; i++) {
          input.set(data.subarray(0, usable), i * usable)
        }
        const all = scanBgzfBlocks(input, 0, input.length)
        return {
          input,
          copies,
          blocks: all.length,
          compressed: input.length,
          chunk: {
            minv: { dataPosition: 0, blockPosition: 0 },
            maxv: {
              dataPosition: 65535,
              blockPosition: all[all.length - 1].filePosition,
            },
          },
        }
      }

      // Every pool alive at once, arms interleaved round by round against one
      // shared sequential baseline. Measuring each worker count in its own pass
      // instead lets machine drift move the passes' baselines apart, which
      // showed up as an 8w column whose raw times were slower than 4w while its
      // ratio was higher. The chunks here stay in the low hundreds of MB for the
      // same reason the passes were split in the first place: at 400MB the heaps
      // of 2+4+8 workers plus the main thread's own run the tab out of memory,
      // and a worker's wasm heap only grows.
      window.runLargeChunks = async config => {
        const pools = []
        for (const count of config.workerCounts) {
          pools.push({
            count,
            pool: await createBgzfWorkerPool(count, undefined, 0),
          })
        }

        const results = []
        for (const f of config.files) {
          const data = await fetchFile(f.path)
          for (const target of config.targets) {
            const { input, chunk, copies, blocks, compressed } = repeatedChunk(
              data,
              target,
            )
            const reference = await unzipChunkSlice(input, chunk)
            const uncompressed = reference.buffer.length
            const identical = {}
            for (const p of pools) {
              const out = await unzipChunkSlice(input, chunk, p.pool)
              identical[p.count] = same(reference.buffer, out.buffer)
            }

            const arms = [
              { key: 'seq', run: () => timeArm(input, chunk, undefined, 1) },
              ...pools.map(p => ({
                key: String(p.count),
                run: () => timeArm(input, chunk, p.pool, 1),
              })),
            ]
            const samples = {}
            for (const arm of arms) {
              samples[arm.key] = []
              await arm.run()
            }
            for (let r = 0; r < config.rounds; r++) {
              for (const arm of arms) {
                samples[arm.key].push(await arm.run())
              }
            }

            results.push({
              name: f.name,
              copies,
              blocks,
              compressed,
              uncompressed,
              identical,
              samples,
            })
          }
        }

        for (const p of pools) {
          p.pool.destroy()
        }
        return { workerCounts: config.workerCounts, results }
      }

      async function benchChunkSizes(name, data, pool, blockCounts, rounds) {
        const allBlocks = scanBgzfBlocks(data, 0, data.length)
        const rows = []

        for (const count of blockCounts) {
          if (count > allBlocks.length) {
            continue
          }
          const { input, chunk, compressed } = middleChunk(
            data,
            allBlocks,
            count,
          )
          const reference = await unzipChunkSlice(input, chunk)
          const pooled = await unzipChunkSlice(input, chunk, pool)
          // keep each measurement about the same total work, so a 2-block row
          // is not one timer read
          const reps = Math.max(2, Math.round(2e7 / reference.buffer.length))

          const arms = [
            { key: 'seq', run: () => timeArm(input, chunk, undefined, reps) },
            { key: 'pool', run: () => timeArm(input, chunk, pool, reps) },
          ]
          const samples = { seq: [], pool: [] }
          for (const arm of arms) {
            await arm.run()
          }
          for (let r = 0; r < rounds; r++) {
            for (const arm of arms) {
              samples[arm.key].push(await arm.run())
            }
          }

          rows.push({
            blocks: count,
            compressed,
            uncompressed: reference.buffer.length,
            reps,
            identical: same(reference.buffer, pooled.buffer),
            samples,
          })
        }
        return { name, rows }
      }

      window.runChunkSizes = async config => {
        const pool = await createBgzfWorkerPool(config.workers, undefined, 0)
        const results = []
        for (const f of config.files) {
          const data = await fetchFile(f.path)
          results.push(
            await benchChunkSizes(
              f.name,
              data,
              pool,
              config.blockCounts,
              config.rounds,
            ),
          )
        }
        pool.destroy()
        return {
          workers: config.workers,
          hardwareConcurrency: navigator.hardwareConcurrency,
          results,
        }
      }

      window.runScaling = async config => {
        const workerCounts = config.workerCounts
        const pools = []
        for (const count of workerCounts) {
          // idleTimeoutMs 0: a reap mid-sweep would put a worker respawn inside
          // a timed arm
          pools.push({
            count,
            pool: await createBgzfWorkerPool(count, undefined, 0),
          })
        }

        const results = []
        for (const f of config.files) {
          const data = await fetchFile(f.path)
          results.push(
            await benchFile(f.name, data, pools, f.reps, config.rounds),
          )
        }

        for (const p of pools) {
          p.pool.destroy()
        }
        return {
          crossOriginIsolated,
          hardwareConcurrency: navigator.hardwareConcurrency,
          workerCounts,
          results,
        }
      }
    </script>
  </body>
</html>
